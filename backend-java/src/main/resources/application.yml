server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: rightly-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rightly}
    username: ${POSTGRES_USER:rightly}
    password: ${POSTGRES_PASSWORD:rightly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

rightly:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-change-me-in-production-min-32-chars}
    session-ttl-hours: ${JWT_SESSION_TTL_HOURS:168}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    driver: ${RIGHTLY_STORAGE_DRIVER:minio}
    local-dir: ${RIGHTLY_UPLOAD_DIR:./uploads}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:rightly-evidence}
  otp:
    ttl-minutes: 5
    send-cooldown-seconds: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    bd.rightly: DEBUG