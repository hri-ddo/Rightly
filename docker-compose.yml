services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rightly-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rightly}
      POSTGRES_USER: ${POSTGRES_USER:-rightly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rightly}
    ports:
      - "5432:5432"
    volumes:
      - rightly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rightly} -d ${POSTGRES_DB:-rightly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rightly-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rightly-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rightly-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: rightly-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-rightly-evidence}
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: rightly-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  rightly-postgres-data:
  rightly-minio-data: